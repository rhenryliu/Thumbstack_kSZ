source:
  main_directory: '/global/cfs/cdirs/desi/survey/catalogs/DA2/'
  post_rec_dir: 'analysis/loa-v1/LSScats/v1.1/BAO/unblinded/desipipe/2pt/recon_sm15_IFFT_recsym/'
  pre_rec_dir: 'LSS/loa-v1/LSScats/v1.1/nonKP/'
  NGC_fn: 'LRG_NGC_clustering.dat.fits'
  SGC_fn: 'LRG_SGC_clustering.dat.fits'

processing:
  cat_type: 'LRG'
  filter_type: 'no_src_with_cluster_mask' # 'unfiltered', 'no_src_with_cluster_mask', or 'nopairs'
  physical_sep: 0.5 # in unit of Mpc, only used when filter_type is 'nopairs'
  zeroV: true # whether to set the mean peculiar velocity to zero; applied independently per field and per z-bin
  zbins:
    - [0.4, 0.6]
    - [0.6, 0.8]
    - [0.8, 0.95]
    - [0.95, 1.1]
  # Fields to produce. 'SGC_DES' and 'SGC_nonDES' are the primary DES-split products.
  # Add 'NGC' to also process the NGC cap, 'full' to produce a combined NGC+SGC catalog.
  # 'full' requires 'NGC' to also be present. Used by both prepare_catalogue_DES.py and convert scripts.
  fields:
    - 'SGC_DES'
    - 'SGC_nonDES'
    - 'full_nonDES'

save:
  save_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/LRG_catalogues_zeroV/'
  save_format: 'csv' # 'csv' or 'txt'
