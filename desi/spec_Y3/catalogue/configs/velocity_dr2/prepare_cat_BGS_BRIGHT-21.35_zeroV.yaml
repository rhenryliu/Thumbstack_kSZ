# DESI official (IFFT RecSym) velocities for BGS_BRIGHT-21.35, the sample of Liam Parker's BGS share
# (ksz_bgs_dr2_20261119), which is a subset of the production BGS_BRIGHT-20.2. Run with prepare_catalogue_yaml.py;
# its per-bin catalogues are the objects, order and official velocities that swap_velocities.py keeps for the
# official, boryana_MG, v_recsym and v_lift_R5 configs here.
source:
  NGC_fn: 'BGS_BRIGHT-21.35_NGC_clustering.dat.fits'
  SGC_fn: 'BGS_BRIGHT-21.35_SGC_clustering.dat.fits'

processing:
  cat_type: 'BGS'
  filter_type: 'no_src_with_cluster_mask'
  zeroV: true # subtract the mean of each cap in each z bin
  zbins:
    - [0.1, 0.2]
    - [0.2, 0.3]
    - [0.3, 0.4]
    - [0.1, 0.4] # bin 4: the whole range 0.1 < z <= 0.4, within the velocity share's 0.1 <= z < 0.4 (full_catalog_Y3 is not cut)

save:
  save_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_catalogues_zeroV_vel_dr2/BGS_BRIGHT-21.35/prepared/'
  save_format: 'csv'
