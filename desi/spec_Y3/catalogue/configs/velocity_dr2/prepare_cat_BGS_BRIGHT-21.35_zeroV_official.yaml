# Known-answer control for the BGS_BRIGHT-21.35 stacks: the DESI official (IFFT RecSym) velocities of
# prepare_cat_BGS_BRIGHT-21.35_zeroV.yaml through swap_velocities.py; VEL_LOS_RENORM must be reproduced.
source:
  production_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_catalogues_zeroV_vel_dr2/BGS_BRIGHT-21.35/prepared/' # objects, order and VEL_LOS
  velocity_column: 'official'

processing:
  cat_type: 'BGS'
  filter_type: 'no_src_with_cluster_mask'
  renorm: true # multiply by D(z)/D(z_eff), as production does for RecSym (constant-bias reconstruction)
  z_eff: 0.780 # as prepare_catalogue_yaml.py; a constant factor, cancels in the estimator
  zeroV: true # subtract the mean of each cap in each z bin
  fields: ['full', 'NGC', 'SGC'] # full-sky stacks and the NGC/SGC consistency test
  zbins:
    - [0.1, 0.2]
    - [0.2, 0.3]
    - [0.3, 0.4]
    - [0.1, 0.4] # bin 4: the whole range, 0.1-0.4

save:
  save_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_catalogues_zeroV_vel_dr2/BGS_BRIGHT-21.35/official/'
  save_format: 'csv'
