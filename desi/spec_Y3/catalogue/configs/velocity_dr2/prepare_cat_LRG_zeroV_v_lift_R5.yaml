# LiFT velocities (v_lift_R5) from Liam Parker's DR2 share (ksz_lrg_dr2_20261117, unpublished: keep private)
# on the production LRG objects, for the kSZ stacks with the v2 filter.
source:
  production_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/LRG_catalogues_zeroV/' # objects and order
  velocity_npz: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/velocity_recon/ksz_lrg_dr2_20261117/desi/galaxies.npz'
  clustering_fits: '/global/cfs/cdirs/desi/survey/catalogs/DA2/LSS/loa-v1/LSScats/v1.1/nonKP/LRG_{cap}_clustering.dat.fits' # exact TARGETID at source_row
  velocity_column: 'v_lift_R5'

processing:
  cat_type: 'LRG'
  filter_type: 'no_src_with_cluster_mask'
  renorm: false # LiFT velocities already carry D(z) (flat slope against v_halo on the HalfDome lightcones)
  zeroV: true # subtract the mean of each cap in each z bin
  fields: ['full']
  zbins:
    - [0.4, 0.6]
    - [0.6, 0.8]
    - [0.8, 0.95]
    - [0.95, 1.1]

save:
  save_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/LRG_catalogues_zeroV_vel_dr2/v_lift_R5/'
  save_format: 'csv'
