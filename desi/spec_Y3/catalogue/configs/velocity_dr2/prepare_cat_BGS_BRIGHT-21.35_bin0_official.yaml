# Bin 0 (0.1 < z <= 0.4, catalogue z4) of the BGS_BRIGHT-21.35 velocity comparison, zeroed per cap within each
# 0.1 sub-range (zero_within): zeroing over the whole range leaves sub-range mean velocities that couple to the mean
# temperature (checks/bgs_bin4_zeroing.py). Bins 1-3 are written too, identical to those of prepare_cat_BGS_BRIGHT-21.35_zeroV_official.yaml;
# only bin 4 (bin 0) differs, and only bin 4 is stacked from this folder.
# Known-answer control for the BGS_BRIGHT-21.35 stacks: the DESI official (IFFT RecSym) velocities of
# prepare_cat_BGS_BRIGHT-21.35_zeroV.yaml through swap_velocities.py; VEL_LOS_RENORM must be reproduced.
source:
  production_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_catalogues_zeroV_vel_dr2/BGS_BRIGHT-21.35/prepared/' # objects, order and VEL_LOS
  velocity_column: 'official'

processing:
  cat_type: 'BGS'
  filter_type: 'no_src_with_cluster_mask'
  renorm: true # multiply by D(z)/D(z_eff), as production does for RecSym (constant-bias reconstruction)
  z_eff: 0.780 # as prepare_catalogue_yaml.py; a constant factor, cancels in the estimator
  zeroV: true # subtract the mean of each cap in each z bin
  fields: ['full', 'NGC', 'SGC'] # full-sky stacks and the NGC/SGC consistency test
  zbins:
    - [0.1, 0.2]
    - [0.2, 0.3]
    - [0.3, 0.4]
    - [0.1, 0.4] # bin 4 = bin 0: the whole range, 0.1-0.4
  zero_within: # zero bin 4 per cap within each sub-range
    4: [[0.1, 0.2], [0.2, 0.3], [0.3, 0.4]]

save:
  save_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_catalogues_zeroV_vel_dr2/BGS_BRIGHT-21.35_bin0/official/'
  save_format: 'csv'
