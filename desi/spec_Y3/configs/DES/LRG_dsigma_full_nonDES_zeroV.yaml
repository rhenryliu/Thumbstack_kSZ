stack:
  save: true # recompute and save temperature decrements
  filterType: 'DSigma'
  zeroV: true # catalogue was prepared with per-cap zeroV; this flag adds the _zeroV suffix to the output dir and re-subtracts the (already ~0) mean for consistency

data:
  cat_type: 'LRG'
  field: 'full_nonDES' # union of NGC and SGC_nonDES — the entire region outside the DES Y3 footprint
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
    - 'DESIY3_LRG_z2'
    - 'DESIY3_LRG_z3'
    - 'DESIY3_LRG_z4'

  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/LRG_catalogues_zeroV/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'

  output_dir: "/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3/"
  extra_str: "{field}_{filter_cut}"

extra:
  save_individual_stacks: false
  catalogue_path: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/LRG_catalogues_zeroV/'
  save_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3/{field}_{filter_cut}/'
  save_name: '{cat_name}_{filterType}_{field}_{filter_cut}.csv'
