# Completeness-weighted kSZ, DSigma, LRG bins 1-4, full sky (v1.1 WEIGHT_COMP x WEIGHT_ZFAIL).
# v1 filter (DSigma): run only when a v1-filter result is asked for; outputs in spec_Y3_DSigma_compweight*.
stack:
  save: false # true: filter the map at each object (new per-object files)
  filterType: 'DSigma'
  zeroV: true
  estimators: ['ksz_uniformweight', 'ksz_compweight']
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3/{field}_{filter_cut}_zeroV/' # read only
  weights: # completeness weight per object, the product of these columns (weight_utils.load_weights)
    columns: ['WEIGHT_COMP', 'WEIGHT_ZFAIL']
  vshuffle: true # velocities shuffled among the stacked objects (after the catalogue mask)
  n_vshuffle: 1000
  save_samples: true
data:
  cat_type: 'LRG'
  field: 'full' # override with --field NGC / SGC
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
    - 'DESIY3_LRG_z2'
    - 'DESIY3_LRG_z3'
    - 'DESIY3_LRG_z4'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues_zeroV/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_compweight/'
  extra_str: "{field}_{filter_cut}"
extra:
  save_individual_stacks: false # its block writes ksz_uniformweight profiles to save_dir
