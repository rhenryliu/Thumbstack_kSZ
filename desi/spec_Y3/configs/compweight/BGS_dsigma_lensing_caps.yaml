# DSigma_lensing, BGS (non-CIGALE, as Figure 25), one cap (--field NGC / SGC): new filtering, weighted and unweighted.
stack:
  save: true # true: filter the map at each object (new per-object files)
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight', 'ksz_compweight']
  weights: # completeness weight per object, the product of these columns (weight_utils.load_weights)
    columns: ['WEIGHT_COMP', 'WEIGHT_ZFAIL']
data:
  cat_type: 'BGS'
  field: 'NGC' # override with --field NGC / SGC
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_BGS'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_compweight/'
  extra_str: "{field}_{filter_cut}"
extra:
  save_individual_stacks: false # its block writes ksz_uniformweight profiles to save_dir
