# Check: make_stacks_shuffle.py with load_once must reproduce configs/null/LRG_dsigma_shuffle_zeroV.yaml's output.
stack:
  save: false # true: filter the map at each object (new per-object files)
  filterType: 'DSigma'
  zeroV: true
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_shuffle/{field}_{filter_cut}_zeroV/' # read only
  shuffle: true
  shuffle_seed: 100 # master seed of the paper's shuffle files (configs/null/ now says 200; the files were made with 100)
  n_seeds: 100
  bootstrap: false # inter-shuffle covariance
  load_once: true
  save_samples: true
data:
  cat_type: 'LRG'
  field: 'full' # override with --field NGC / SGC
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
    - 'DESIY3_LRG_z2'
    - 'DESIY3_LRG_z3'
    - 'DESIY3_LRG_z4'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues_zeroV/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/compweight_checks/shuffle_known_answer_DSigma/'
  extra_str: "{field}_{filter_cut}"
extra:
  save_individual_stacks: false # its block writes ksz_uniformweight profiles to save_dir
