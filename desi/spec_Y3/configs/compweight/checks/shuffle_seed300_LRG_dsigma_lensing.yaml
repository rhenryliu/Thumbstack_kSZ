# Diagnostic (a one-off check behind docs/completeness_weighted_ksz_results.md): the paper-style DSigma_lensing shuffle null of LRG z3 with an independent master seed.
# Run for LRG z3 only, with --cat-names DESIY3_LRG_z3 (cat_names below lists all four).
stack:
  save: false # true: filter the map at each object (new per-object files)
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight', 'ksz_compweight']
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing/{field}_{filter_cut}_zeroV/' # read only
  weights: # completeness weight per object, the product of these columns (weight_utils.load_weights)
    columns: ['WEIGHT_COMP', 'WEIGHT_ZFAIL']
  shuffle: true
  shuffle_seed: 300 # diagnostic: an independent seed set, not the paper's
  n_seeds: 1000
  bootstrap: false # inter-shuffle covariance
  load_once: true
  save_samples: true
data:
  cat_type: 'LRG'
  field: 'full' # override with --field NGC / SGC
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
    - 'DESIY3_LRG_z2'
    - 'DESIY3_LRG_z3'
    - 'DESIY3_LRG_z4'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues_zeroV/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/compweight_checks/shuffle_seed300/'
  extra_str: "{field}_{filter_cut}"
extra:
  save_individual_stacks: false # its block writes ksz_uniformweight profiles to save_dir
