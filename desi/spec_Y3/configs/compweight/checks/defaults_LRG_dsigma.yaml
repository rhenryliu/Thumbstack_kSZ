# Check: the default estimator on the production DSigma filtering must reproduce production (LRG z1).
stack:
  save: false # true: filter the map at each object (new per-object files)
  filterType: 'DSigma'
  zeroV: true
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3/{field}_{filter_cut}_zeroV/' # read only
data:
  cat_type: 'LRG'
  field: 'full' # override with --field NGC / SGC
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues_zeroV/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/compweight_checks/defaults/DSigma/'
  extra_str: "{field}_{filter_cut}"
extra:
  save_individual_stacks: false # its block writes ksz_uniformweight profiles to save_dir
