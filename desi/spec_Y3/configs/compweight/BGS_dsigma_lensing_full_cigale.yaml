# Completeness-weighted kSZ, DSigma_lensing, BGS CIGALE, full sky (v1.1 weights from the lensing side file).
stack:
  save: false # true: filter the map at each object (new per-object files)
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight', 'ksz_compweight']
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing/CIGALE/{field}_{filter_cut}_zeroV/' # read only
  weights: # completeness weight per object, the product of these columns (weight_utils.load_weights)
    columns: ['WEIGHT_COMP', 'WEIGHT_ZFAIL']
    file: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/lensing/CIGALE/lens_weights/desi_BGS_bin0.fits' # row aligned with the catalogue
  vshuffle: true # velocities shuffled among the stacked objects (after the catalogue mask)
  n_vshuffle: 1000
  save_samples: true
data:
  cat_type: 'BGS'
  field: 'full' # override with --field NGC / SGC
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_BGS'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_CIGALE/{cat_type}_catalogues/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_compweight/CIGALE/'
  extra_str: "{field}_{filter_cut}"
extra:
  save_individual_stacks: false # its block writes ksz_uniformweight profiles to save_dir
