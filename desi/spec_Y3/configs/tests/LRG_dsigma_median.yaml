stack:
  save: true        # set true on first run to generate filtmap files; false thereafter
  filterType: 'DSigma'
  zeroV: true
  median: true       # use median estimator; _median is appended to extra_str automatically
  bootstrap: true   # approximate sStack is sufficient for this diagnostic

data:
  cat_type: 'LRG'
  field: 'SGC'
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
    - 'DESIY3_LRG_z2'
    - 'DESIY3_LRG_z3'
    - 'DESIY3_LRG_z4'

  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'

  output_dir: "/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3/"
  extra_str: "{field}_{filter_cut}"  # _median appended automatically by make_stacks_median.py

extra:
  save_individual_stacks: false
