# BGS_BRIGHT-21.35 (the sample of Liam Parker's BGS share) with the DESI official (IFFT RecSym) velocities, v2 filter.
# This run filters the map at each object (save: true); boryana_MG, v_recsym and v_lift_R5 read its per-object
# filtering, so all four share the bootstrap resamples. Run with --field full, NGC and SGC; bin 4 is 0.1 < z <= 0.4.
stack:
  save: true # filter the map at each object; the other velocity sets read this filtering
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight']
  save_samples: true # bootstrap realisations, seeded per sample: the same resamples in every velocity run

data:
  cat_type: 'BGS'
  field: 'full' # override with --field NGC / SGC for the cap consistency test
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_BGS_z1' # 0.1 < z <= 0.2
    - 'DESIY3_BGS_z2' # 0.2 < z <= 0.3
    - 'DESIY3_BGS_z3' # 0.3 < z <= 0.4
    - 'DESIY3_BGS_z4' # 0.1 < z <= 0.4, the whole range
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_catalogues_zeroV_vel_dr2/BGS_BRIGHT-21.35/official/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_vel_dr2/BGS_BRIGHT-21.35/official/'
  extra_str: "{field}_{filter_cut}"

extra:
  save_individual_stacks: false # its block reads the production-style catalogue, not this one
