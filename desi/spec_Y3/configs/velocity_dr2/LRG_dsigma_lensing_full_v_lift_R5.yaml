# kSZ stacks with Liam Parker's LiFT velocities (v_lift_R5, DR2 share ksz_lrg_dr2_20261117, unpublished),
# v2 filter on the production per-object filtering: only the velocities differ from v2.1.
# Compare with the official control (LRG_dsigma_lensing_full_official.yaml) in checks/compare_velocity_stacks.py.
stack:
  save: false # filtering read from filtering_dir
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight']
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing/{field}_{filter_cut}_zeroV/' # read only
  save_samples: true # bootstrap realisations, seeded per sample: the same resamples in every velocity run

data:
  cat_type: 'LRG'
  field: 'full'
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
    - 'DESIY3_LRG_z2'
    - 'DESIY3_LRG_z3'
    - 'DESIY3_LRG_z4'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues_zeroV_vel_dr2/v_lift_R5/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_vel_dr2/v_lift_R5/'
  extra_str: "{field}_{filter_cut}"

extra:
  save_individual_stacks: false # its block reads the production-style catalogue, not this one
