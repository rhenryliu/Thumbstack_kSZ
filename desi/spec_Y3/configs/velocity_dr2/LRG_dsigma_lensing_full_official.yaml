# Known-answer control for the stacks with Liam Parker's DR2 velocities: the production velocities through
# catalogue/swap_velocities.py, stacked with the v2 filter on the production per-object filtering.
# The profile must equal spec_Y3_DSigma_lensing/ (v2.1); the saved bootstrap samples pair with v_lift_R5's.
stack:
  save: false # filtering read from filtering_dir
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight']
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing/{field}_{filter_cut}_zeroV/' # read only
  save_samples: true # bootstrap realisations, seeded per sample: the same resamples in every velocity run

data:
  cat_type: 'LRG'
  field: 'full'
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
    - 'DESIY3_LRG_z2'
    - 'DESIY3_LRG_z3'
    - 'DESIY3_LRG_z4'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues_zeroV_vel_dr2/official/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_vel_dr2/official/'
  extra_str: "{field}_{filter_cut}"

extra:
  save_individual_stacks: false # its block reads the production-style catalogue, not this one
