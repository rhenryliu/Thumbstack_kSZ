# BGS_BRIGHT-21.35 with Liam Parker's LiFT velocities (v_lift_R5, BGS share ksz_bgs_dr2_20261119, unpublished),
# v2 filter, on the per-object filtering of the official run (BGS_BRIGHT-21.35_dsigma_lensing_official.yaml).
stack:
  save: false # filtering read from filtering_dir
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight']
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_vel_dr2/BGS_BRIGHT-21.35/official/{field}_{filter_cut}_zeroV/' # read only
  save_samples: true # bootstrap realisations, seeded per sample: the same resamples in every velocity run

data:
  cat_type: 'BGS'
  field: 'full' # override with --field NGC / SGC for the cap consistency test
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_BGS_z1' # 0.1 < z <= 0.2
    - 'DESIY3_BGS_z2' # 0.2 < z <= 0.3
    - 'DESIY3_BGS_z3' # 0.3 < z <= 0.4
    - 'DESIY3_BGS_z4' # 0.1 < z <= 0.4, the whole range
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_catalogues_zeroV_vel_dr2/BGS_BRIGHT-21.35/v_lift_R5/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_vel_dr2/BGS_BRIGHT-21.35/v_lift_R5/'
  extra_str: "{field}_{filter_cut}"

extra:
  save_individual_stacks: false # its block reads the production-style catalogue, not this one
