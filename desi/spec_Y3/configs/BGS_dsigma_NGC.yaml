stack:
  save: true # For whether to save new thumbstack files
  filterType: 'DSigma' # which filter to use for stacking.
  zeroV: false # Whether to use zeroV correction

data: # This is the input data for the stack, which will be read in by the stack code
  cat_type: 'BGS' # BGS instead of LRG
  field: 'NGC' # NGC, SGC, or full
  filter_cut: 'nopairs' # unfiltered, no_src_with_cluster_mask, or nopairs
  cat_names: # BGS has 3 redshift bins
    - 'DESIY3_BGS'
    - 'DESIY3_BGS_z1'
    - 'DESIY3_BGS_z2'
    - 'DESIY3_BGS_z3'

  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues/' # Frank's SPEC Y3 data
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/' 
  cat_fn: 'catalog_{field}_{filter_cut}.txt'

  output_dir: "/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3/"
  extra_str: "{field}_{filter_cut}"

extra:
  save_invidiual_stacks: false
  catalogue_path: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues/'
  catalogue_dataframe: '{field}_zbin{bin}_{filter_cut}.csv'
  save_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3/{field}_{filter_cut}/'
  save_name: '{cat_name}_{filterType}_{field}_{filter_cut}.csv'
