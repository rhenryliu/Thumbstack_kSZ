# Stellar-mass-weighted kSZ (w = M*^(2/3) with the CIGALE masses, estimator ksz_mstarweight) and the
# unweighted stack of the same objects, v2 filter (DSigma_lensing), BGS CIGALE, full sky, on the
# production per-object filtering. Objects with LOGMSTAR <= 0 are dropped from both.
stack:
  save: false # filtering read from filtering_dir
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight', 'ksz_mstarweight']
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing/CIGALE/{field}_{filter_cut}_zeroV/' # read only
  mstar_weights: # w = (10^LOGMSTAR)^power (weight_utils.load_mstar_weights)
    col: 'LOGMSTAR'
    power: '2/3'
  vshuffle: true # velocities shuffled among the stacked objects (after the catalogue mask)
  n_vshuffle: 1000
  save_samples: true
data:
  cat_type: 'BGS'
  field: 'full'
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_BGS'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/BGS_CIGALE/{cat_type}_catalogues/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_mstarweight/CIGALE/'
  extra_str: "{field}_{filter_cut}"
extra:
  save_individual_stacks: false
