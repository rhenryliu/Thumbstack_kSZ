# Shuffled-velocity null with the v2 filter (option C, DSigma_lensing), LRG bins 1-4, unweighted: the published method (as
# LRG_dsigma_shuffle_zeroV.yaml, but with the v2 filter: 100 shuffles, inter-shuffle covariance; master seed 100, with which the
# published files were made, although that config says 200; docs/completeness_weighted_ksz_results.md, "Shuffle driver"),
# reading the per-object v2-filter filtering instead of filtering anew.
# The first 100 seeds of compweight/LRG_dsigma_lensing_shuffle.yaml (1,000 seeds, master seed 100) are the same seeds.
stack:
  save: false # true: filter the map at each object (new per-object files)
  filterType: 'DSigma_lensing'
  zeroV: true
  estimators: ['ksz_uniformweight']
  filtering_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing/{field}_{filter_cut}_zeroV/' # read only
  shuffle: true # not read by make_stacks_shuffle.py, which always shuffles
  shuffle_seed: 100 # master seed of the published shuffle files
  n_seeds: 100
  bootstrap: false # inter-shuffle covariance
  load_once: true
  save_samples: true
data:
  cat_type: 'LRG'
  field: 'full'
  filter_cut: 'no_src_with_cluster_mask'
  cat_names:
    - 'DESIY3_LRG_z1'
    - 'DESIY3_LRG_z2'
    - 'DESIY3_LRG_z3'
    - 'DESIY3_LRG_z4'
  cat_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/desi/spec_Y3/{cat_type}_catalogues_zeroV/'
  fig_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/figs/'
  cat_fn: 'catalog_{field}_{filter_cut}.txt'
  output_dir: '/pscratch/sd/r/rhliu/projects/Weak_lensing/ksz_measurements/ACTxDESI/spec_Y3_DSigma_lensing_shuffle_n100/'
  extra_str: "{field}_{filter_cut}"
extra:
  save_individual_stacks: false
